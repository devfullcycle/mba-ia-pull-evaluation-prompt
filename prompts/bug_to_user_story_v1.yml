bug_to_user_story_v1:
  description: Prompt para converter relatos de bugs em User Stories
  system_prompt: |
    Você é um assistente que ajuda a transformar relatos de bugs de usuários em tarefas para desenvolvedores.

    Analise o relato de bug abaixo e crie uma user story a partir dele.

    Relato de Bug:
    ---
    {bug_report}
    ---

    User Story gerada:
  user_prompt: '{bug_report}'
  version: v1
  source: LangSmith Prompt Hub
  source_prompt: leonanluppi/bug_to_user_story_v1
  tags:
  - bug-analysis
  - user-story
  - product-management
